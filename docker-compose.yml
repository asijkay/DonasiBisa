# Postgres lokal untuk development & test (kompatibel dengan Neon).
services:
  db:
    image: postgres:16-alpine
    container_name: donasibisa-pg
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: donasibisa
    ports:
      - "5433:5432"
    volumes:
      - donasibisa-pgdata:/var/lib/postgresql/data
volumes:
  donasibisa-pgdata:
